<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Đăng nhập — AI Use Case Platform TT SPTD">
  <title>Đăng nhập — AI Use Case Platform</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">

  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/typography.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/states.css">
  <link rel="stylesheet" href="assets/css/login.css">
</head>
<body class="login-page">

  <!-- Header -->
  <header class="login-header" role="banner">
    <div class="login-brand">
      <span class="login-brand-icon" aria-hidden="true">🚀</span>
      <span class="login-brand-name">Bình dân hóa AI</span>
    </div>
  </header>

  <!-- Main -->
  <main class="login-main" role="main">
    <div class="login-card" role="region" aria-label="Đăng nhập">

      <!-- Card top (purple) -->
      <div class="login-card-top">
        <div class="login-card-icon" aria-hidden="true">🔐</div>
        <h1 class="login-card-title">Đăng nhập</h1>
        <p class="login-card-subtitle">
          Hệ thống quản lý AI Use Case<br>
          Trung tâm Sản phẩm &amp; Giải pháp Tín dụng
        </p>
      </div>

      <!-- Card body -->
      <div class="login-card-body">
        <form id="loginForm" novalidate autocomplete="on" aria-label="Form đăng nhập">

          <div class="login-field">
            <label class="login-label" for="loginEmail">
              Tên đăng nhập
              <span style="color:var(--color-error)" aria-label="bắt buộc">*</span>
            </label>
            <input
              type="text"
              id="loginEmail"
              name="username"
              class="login-input"
              placeholder="VD: tuantt4"
              autocomplete="username"
              autofocus
              aria-required="true"
              aria-describedby="loginEmailError"
            >
          </div>

          <div class="login-field">
            <label class="login-label" for="loginPassword">
              Mật khẩu
              <span style="color:var(--color-error)" aria-label="bắt buộc">*</span>
            </label>
            <input
              type="password"
              id="loginPassword"
              name="password"
              class="login-input"
              placeholder="Nhập mật khẩu"
              autocomplete="current-password"
              aria-required="true"
              aria-describedby="loginEmailError"
            >
            <p id="loginEmailError" class="login-field-error" role="alert" aria-live="polite">
              <span aria-hidden="true">✕</span>
              <span id="loginEmailErrorMsg"></span>
            </p>
          </div>

          <button type="submit" id="loginBtn" class="login-btn">
            <span class="login-btn-spinner" aria-hidden="true"></span>
            <span class="login-btn-label">Đăng nhập →</span>
          </button>

        </form>

        <p class="login-note">
          Đăng nhập bằng tài khoản dùng chung với Dashboard SHTD.<br>
          Liên hệ quản trị nếu cần cấp lại mật khẩu.
        </p>
      </div>

    </div>
  </main>

  <!-- Scripts -->
  <script src="config/env.js"></script>
  <script src="config/routes.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/api.js"></script>
  <script>
    (function () {
      'use strict';

      // Accept only *.html filenames (optional simple query string).
      function safeReturnUrl(raw) {
        var decoded = raw || 'index.html';
        return /^[a-zA-Z0-9_-]+\.html(\?[a-zA-Z0-9_.=&%-]*)?$/.test(decoded)
          ? decoded : 'index.html';
      }

      // If already logged in → go to return URL or portal
      var existingUser = AuthService.getUser();
      if (existingUser) {
        var sp = new URLSearchParams(window.location.search);
        window.location.replace(safeReturnUrl(sp.get('return')));
        return;
      }

      var emailEl  = document.getElementById('loginEmail');
      var passEl   = document.getElementById('loginPassword');
      var errorEl  = document.getElementById('loginEmailError');
      var errorMsg = document.getElementById('loginEmailErrorMsg');
      var loginBtn = document.getElementById('loginBtn');

      function showError(msg) {
        errorMsg.textContent = msg;
        errorEl.classList.add('visible');
        emailEl.classList.add('has-error');
        passEl.classList.add('has-error');
        loginBtn.classList.remove('is-loading');
        loginBtn.disabled = false;
      }

      function clearError() {
        errorEl.classList.remove('visible');
        emailEl.classList.remove('has-error');
        passEl.classList.remove('has-error');
      }

      function setLoading(on) {
        loginBtn.classList.toggle('is-loading', on);
        loginBtn.disabled = on;
      }

      function doRedirect() {
        var sp = new URLSearchParams(window.location.search);
        window.location.replace(safeReturnUrl(sp.get('return')));
      }

      emailEl.addEventListener('input', clearError);
      passEl.addEventListener('input', clearError);

      document.getElementById('loginForm').addEventListener('submit', function (e) {
        e.preventDefault();
        clearError();

        var uname = (emailEl.value || '').trim();
        var pass  = passEl.value || '';
        if (!uname) { showError('Vui lòng nhập tên đăng nhập'); emailEl.focus(); return; }
        if (!pass)  { showError('Vui lòng nhập mật khẩu'); passEl.focus(); return; }

        setLoading(true);

        // Đăng nhập bằng tài khoản dùng chung SHTD (username + password → token).
        // KHÔNG fallback local: auth có mật khẩu, không được bypass khi lỗi mạng.
        Api.authLogin(uname, pass)
          .then(function(resp) {
            // GAS trả { token, user:{username, displayName, role, team, email} }
            AuthService.storeAuth(resp);
            doRedirect();
          })
          .catch(function(err) {
            var msg = String(err && err.message || 'Đăng nhập thất bại. Vui lòng thử lại.');
            showError(msg);
            passEl.focus();
          });
      });
    })();
  </script>

</body>
</html>
