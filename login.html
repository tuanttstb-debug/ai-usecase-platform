<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Đăng nhập — AI Use Case Platform TT SPTD">
  <title>Đăng nhập — AI Use Case Platform</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">

  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/typography.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/states.css">
  <link rel="stylesheet" href="assets/css/login.css">
</head>
<body class="login-page">

  <!-- Header -->
  <header class="login-header" role="banner">
    <div class="login-brand">
      <span class="login-brand-icon" aria-hidden="true">🚀</span>
      <span class="login-brand-name">Bình dân hóa AI</span>
    </div>
  </header>

  <!-- Main -->
  <main class="login-main" role="main">
    <div class="login-card" role="region" aria-label="Đăng nhập">

      <!-- Card top (purple) -->
      <div class="login-card-top">
        <div class="login-card-icon" aria-hidden="true">🔐</div>
        <h1 class="login-card-title">Đăng nhập</h1>
        <p class="login-card-subtitle">
          Hệ thống quản lý AI Use Case<br>
          Trung tâm Sản phẩm &amp; Giải pháp Tín dụng
        </p>
      </div>

      <!-- Card body -->
      <div class="login-card-body">
        <form id="loginForm" novalidate autocomplete="on" aria-label="Form đăng nhập">

          <div class="login-field">
            <label class="login-label" for="loginEmail">
              Tên đăng nhập
              <span style="color:var(--color-error)" aria-label="bắt buộc">*</span>
            </label>
            <input
              type="text"
              id="loginEmail"
              name="username"
              class="login-input"
              placeholder="VD: tuantt4"
              autocomplete="username"
              autofocus
              aria-required="true"
              aria-describedby="loginEmailError"
            >
            <p id="loginEmailError" class="login-field-error" role="alert" aria-live="polite">
              <span aria-hidden="true">✕</span>
              <span id="loginEmailErrorMsg"></span>
            </p>
          </div>

          <button type="submit" id="loginBtn" class="login-btn">
            <span class="login-btn-spinner" aria-hidden="true"></span>
            <span class="login-btn-label">Đăng nhập →</span>
          </button>

        </form>

        <p class="login-note">
          Nhập tên đăng nhập nội bộ TT SPTD.<br>
          Liên hệ quản trị nếu cần hỗ trợ quyền truy cập.
        </p>
      </div>

    </div>
  </main>

  <!-- Scripts -->
  <script src="config/env.js"></script>
  <script src="config/routes.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/api.js"></script>
  <script>
    (function () {
      'use strict';

      // Accept only *.html filenames (optional simple query string).
      function safeReturnUrl(raw) {
        var decoded = raw || 'index.html';
        return /^[a-zA-Z0-9_-]+\.html(\?[a-zA-Z0-9_.=&%-]*)?$/.test(decoded)
          ? decoded : 'index.html';
      }

      // If already logged in → go to return URL or portal
      var existingUser = AuthService.getUser();
      if (existingUser) {
        var sp = new URLSearchParams(window.location.search);
        window.location.replace(safeReturnUrl(sp.get('return')));
        return;
      }

      var emailEl  = document.getElementById('loginEmail');
      var errorEl  = document.getElementById('loginEmailError');
      var errorMsg = document.getElementById('loginEmailErrorMsg');
      var loginBtn = document.getElementById('loginBtn');

      function showError(msg) {
        errorMsg.textContent = msg;
        errorEl.classList.add('visible');
        emailEl.classList.add('has-error');
        emailEl.setAttribute('aria-invalid', 'true');
        loginBtn.classList.remove('is-loading');
        loginBtn.disabled = false;
        emailEl.focus();
      }

      function clearError() {
        errorEl.classList.remove('visible');
        emailEl.classList.remove('has-error');
        emailEl.removeAttribute('aria-invalid');
      }

      function setLoading(on) {
        loginBtn.classList.toggle('is-loading', on);
        loginBtn.disabled = on;
      }

      function doRedirect() {
        var sp = new URLSearchParams(window.location.search);
        window.location.replace(safeReturnUrl(sp.get('return')));
      }

      emailEl.addEventListener('input', clearError);

      document.getElementById('loginForm').addEventListener('submit', function (e) {
        e.preventDefault();
        clearError();

        var uname = (emailEl.value || '').trim();
        if (!uname) { showError('Vui lòng nhập tên đăng nhập'); return; }

        setLoading(true);

        // Validate với GAS USERS sheet — lấy role chính xác từ server
        Api.validateUser(uname)
          .then(function(data) {
            // GAS trả về { username, displayName, role, team, email }
            AuthService.storeUser({
              email:       data.username,
              displayName: data.displayName,
              role:        data.role,
              team:        data.team || '',
              loginAt:     new Date().toISOString()
            });
            doRedirect();
          })
          .catch(function(err) {
            // GAS không khả dụng hoặc lỗi mạng → fallback về local session
            var msg = String(err && err.message || '');
            // Nếu GAS trả lỗi rõ ràng (tài khoản bị khóa) → hiện lỗi
            if (msg.indexOf('vô hiệu hóa') !== -1 || msg.indexOf('chưa được cấp phép') !== -1) {
              showError(msg);
              return;
            }
            // Trường hợp còn lại (timeout, mất mạng) → local login
            var result = AuthService.login(uname);
            if (!result.success) { showError(result.error); return; }
            doRedirect();
          });
      });
    })();
  </script>

</body>
</html>
