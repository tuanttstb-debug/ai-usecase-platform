  <style>
    /* ── Leaderboard-specific styles ── */
    .lb-header { padding: var(--space-8) var(--space-8) var(--space-6); border-bottom: 1px solid var(--color-border); }
    .lb-filters { display: flex; gap: var(--space-3); flex-wrap: wrap; align-items: center; }
    .lb-filter-select { padding: var(--space-2) var(--space-4); border: 1px solid var(--color-border); border-radius: var(--radius-md); font-size: var(--text-sm); background: var(--color-surface); color: var(--color-text); cursor: pointer; }
    .lb-tabs { display: flex; gap: var(--space-2); margin-top: var(--space-5); border-bottom: 2px solid var(--color-border); }
    .lb-tab { padding: var(--space-3) var(--space-5); font-size: var(--text-sm); font-weight: var(--font-weight-medium); color: var(--color-text-secondary); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all var(--transition-fast); }
    .lb-tab.is-active { color: var(--color-primary); border-bottom-color: var(--color-primary); }
    .lb-tab:hover:not(.is-active) { color: var(--color-text); }

    /* Ranking table */
    .rank-table { width: 100%; border-collapse: collapse; }
    .rank-table th { padding: var(--space-3) var(--space-4); text-align: left; font-size: var(--text-xs); font-weight: var(--font-weight-semibold); color: var(--color-text-secondary); text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--color-border); background: var(--color-bg-alt); }
    .rank-table td { padding: var(--space-4); border-bottom: 1px solid var(--color-border); font-size: var(--text-sm); vertical-align: middle; }
    .rank-table tr:last-child td { border-bottom: none; }
    .rank-table tr:hover td { background: var(--color-bg-alt); }

    /* Rank number badge */
    .rank-num { width: 32px; height: 32px; border-radius: var(--radius-full); display: flex; align-items: center; justify-content: center; font-weight: var(--font-weight-bold); font-size: var(--text-sm); flex-shrink: 0; }
    .rank-num.gold   { background: #FFF3CD; color: #856404; }
    .rank-num.silver { background: #F0F0F0; color: #555; }
    .rank-num.bronze { background: #FFE8D6; color: #7C4A1E; }
    .rank-num.normal { background: var(--color-bg); color: var(--color-text-secondary); }
    .rank-num.bottom { background: var(--color-error-light); color: var(--color-error); }

    /* Score badge */
    .score-badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: var(--radius-full); font-size: var(--text-xs); font-weight: var(--font-weight-semibold); }
    .score-badge.top    { background: #E8F5E9; color: #2E7D32; }
    .score-badge.strong { background: #E3F2FD; color: #1565C0; }
    .score-badge.avg    { background: #FFF8E1; color: #E65100; }
    .score-badge.bottom { background: #FFEBEE; color: #C62828; }

    /* Rank category pill */
    .rank-pill { display: inline-block; padding: 2px 8px; border-radius: var(--radius-full); font-size: 11px; font-weight: var(--font-weight-semibold); }

    /* Score bar mini */
    .score-bar-wrap { display: flex; align-items: center; gap: var(--space-3); }
    .score-bar-track { flex: 1; height: 6px; background: var(--color-border); border-radius: 3px; overflow: hidden; }
    .score-bar-fill { height: 100%; border-radius: 3px; background: var(--color-primary); transition: width 0.6s ease; }
    .score-bar-fill.top    { background: #4CAF50; }
    .score-bar-fill.strong { background: #2196F3; }
    .score-bar-fill.avg    { background: #F6B100; }
    .score-bar-fill.bottom { background: #F44336; }
    .score-val { font-weight: var(--font-weight-semibold); font-size: var(--text-sm); min-width: 32px; text-align: right; }

    /* Category distribution */
    .cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: var(--space-4); margin-top: var(--space-4); }
    .cat-card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: var(--space-4) var(--space-5); }
    .cat-card-name { font-size: var(--text-xs); font-weight: var(--font-weight-semibold); text-transform: uppercase; letter-spacing: 0.5px; color: var(--color-text-secondary); margin-bottom: var(--space-2); }
    .cat-card-count { font-size: var(--text-2xl); font-weight: var(--font-weight-bold); color: var(--color-primary); }
    .cat-card-avg { font-size: var(--text-xs); color: var(--color-text-secondary); margin-top: 4px; }

    /* Loading + empty */
    .lb-loading { display: flex; align-items: center; justify-content: center; padding: var(--space-16); color: var(--color-text-muted); gap: var(--space-3); }
    .spinner { width: 20px; height: 20px; border: 2px solid var(--color-border); border-top-color: var(--color-primary); border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .section-panel { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-xl); overflow: hidden; margin-bottom: var(--space-6); }
    .section-panel-header { padding: var(--space-4) var(--space-6); border-bottom: 1px solid var(--color-border); display: flex; align-items: center; justify-content: space-between; }
    .section-panel-title { font-size: var(--text-base); font-weight: var(--font-weight-semibold); color: var(--color-text); }
    .section-panel-body { padding: 0; }

    .owner-cell { display: flex; flex-direction: column; }
    .owner-name { font-weight: var(--font-weight-medium); color: var(--color-text); }
    .owner-team { font-size: var(--text-xs); color: var(--color-text-secondary); margin-top: 1px; }
  </style>

<script>
var _lbData   = null;
var _activeTab = 'top';

document.addEventListener('DOMContentLoaded', function() {
  initAuth();
  loadLeaderboard();
});

function initAuth() {
  var user = Api.currentUser ? Api.currentUser() : null;
  try { user = JSON.parse(sessionStorage.getItem(APP_CONFIG.USER_SESSION_KEY)); } catch(e) {}
  if (!user) { window.location.href = 'login.html'; return; }
  var footer = document.getElementById('sidebarFooter');
  if (footer) footer.innerHTML = '<div class="sidebar-user"><span class="sidebar-user-name">' + (user.displayName || user.email || '') + '</span><span class="sidebar-user-role">' + (user.role || 'user') + '</span></div>';
  if (user.role === 'admin') {
    document.getElementById('navDashboard').style.display = '';
    document.getElementById('navManagerReview').style.display = '';
  }
}

function loadLeaderboard() {
  var category = document.getElementById('filterCategory').value;
  var team     = document.getElementById('filterTeam').value;

  setLoading(true);
  Api.jsonp(API.leaderboard({ category: category, team: team, limit: 20 }), function(res) {
    if (!res || !res.success) { setError('Không tải được dữ liệu'); return; }
    _lbData = res.data;
    renderAll(_lbData);
    setLoading(false);
  });
}

function renderAll(data) {
  if (!data) return;
  renderTable('topTable',    data.top_performers,    false);
  renderTable('bottomTable', data.bottom_performers, true);
  renderCategorySection(data.category_rankings);
  document.getElementById('topCount').textContent    = (data.top_performers    || []).length + ' use cases';
  document.getElementById('bottomCount').textContent = (data.bottom_performers || []).length + ' use cases';
  // Populate team dropdown from data
  var currentTeam = document.getElementById('filterTeam').value;
  var teams = {};
  (data.top_performers || []).concat(data.bottom_performers || []).forEach(function(uc) {
    if (uc.team) teams[uc.team] = 1;
  });
  var sel = document.getElementById('filterTeam');
  while (sel.options.length > 1) sel.remove(1);
  Object.keys(teams).sort().forEach(function(t) {
    var opt = document.createElement('option'); opt.value = t; opt.textContent = t;
    if (t === currentTeam) opt.selected = true;
    sel.appendChild(opt);
  });
}

function renderTable(containerId, items, isBottom) {
  var el = document.getElementById(containerId);
  if (!items || items.length === 0) {
    el.innerHTML = '<div style="padding:var(--space-8);text-align:center;color:var(--color-text-muted)">Chưa có dữ liệu xếp hạng</div>';
    return;
  }
  var rows = items.map(function(uc, i) {
    var rank  = uc.rank || (i + 1);
    var cls   = rank === 1 ? 'gold' : rank === 2 ? 'silver' : rank === 3 ? 'bronze' : isBottom ? 'bottom' : 'normal';
    var score = uc.total_score || 0;
    var rankCat = uc.rank_category || '';
    var barCls  = rankCat === 'TOP_PERFORMER' ? 'top' : rankCat === 'STRONG_CONTRIBUTOR' ? 'strong' : rankCat === 'AVERAGE' ? 'avg' : 'bottom';
    var pillStyle = RANK_LABELS[rankCat] ? ('background:' + RANK_LABELS[rankCat].bg + ';color:' + RANK_LABELS[rankCat].color) : '';
    var rewardBadge = String(uc.reward_eligible).toUpperCase() === 'TRUE'
      ? '<span style="font-size:10px;background:#E8F5E9;color:#2E7D32;padding:2px 6px;border-radius:10px;margin-left:4px">Khen thưởng</span>' : '';
    var warnBadge = String(uc.warning_flag).toUpperCase() === 'TRUE'
      ? '<span style="font-size:10px;background:#FFEBEE;color:#C62828;padding:2px 6px;border-radius:10px;margin-left:4px">Cảnh báo</span>' : '';
    return '<tr>' +
      '<td><div class="rank-num ' + cls + '">' + rank + '</div></td>' +
      '<td><div class="owner-cell"><span class="owner-name">' + esc(uc.name) + rewardBadge + warnBadge + '</span><span class="owner-team">' + esc(uc.usecase_id) + ' · ' + esc(uc.team) + '</span></div></td>' +
      '<td><div class="owner-cell"><span class="owner-name">' + esc(uc.owner_name) + '</span></div></td>' +
      '<td><span class="rank-pill" style="' + pillStyle + '">' + (RANK_LABELS[rankCat] ? RANK_LABELS[rankCat].label : rankCat) + '</span></td>' +
      '<td><div class="score-bar-wrap"><div class="score-bar-track"><div class="score-bar-fill ' + barCls + '" style="width:' + score + '%"></div></div><span class="score-val">' + score + '</span></div></td>' +
      '<td style="color:var(--color-text-secondary);font-size:var(--text-xs)">' + (uc.hours_saved_actual > 0 ? uc.hours_saved_actual + 'h' : '—') + '</td>' +
      '</tr>';
  }).join('');

  el.innerHTML = '<table class="rank-table">' +
    '<thead><tr><th style="width:48px">#</th><th>Use Case</th><th>Người đăng ký</th><th>Hạng</th><th style="min-width:180px">Điểm (100)</th><th>Giờ tiết kiệm</th></tr></thead>' +
    '<tbody>' + rows + '</tbody></table>';
}

function renderCategorySection(catRankings) {
  var el = document.getElementById('categoryContent');
  if (!catRankings || Object.keys(catRankings).length === 0) {
    el.innerHTML = '<div style="text-align:center;padding:var(--space-8);color:var(--color-text-muted)">Chưa có dữ liệu theo category</div>';
    return;
  }
  var html = '';
  Object.keys(catRankings).forEach(function(cat) {
    var items = catRankings[cat];
    if (!items || items.length === 0) return;
    var label = CATEGORY_LABELS[cat] || cat;
    html += '<div class="section-panel" style="margin-bottom:var(--space-5)">';
    html += '<div class="section-panel-header"><span class="section-panel-title">' + label + '</span><span style="font-size:var(--text-xs);color:var(--color-text-secondary)">' + items.length + ' use cases</span></div>';
    html += '<div class="section-panel-body">';
    // Mini table for category
    var rows = items.slice(0, 5).map(function(uc, i) {
      var score = uc.total_score || 0;
      var barCls = score >= 85 ? 'top' : score >= 70 ? 'strong' : score >= 50 ? 'avg' : 'bottom';
      return '<tr>' +
        '<td style="width:32px;color:var(--color-text-secondary);font-weight:600">' + (i+1) + '</td>' +
        '<td><span style="font-weight:500">' + esc(uc.name) + '</span><br><span style="font-size:11px;color:var(--color-text-secondary)">' + esc(uc.team) + ' · ' + esc(uc.owner_name) + '</span></td>' +
        '<td style="min-width:140px"><div class="score-bar-wrap"><div class="score-bar-track"><div class="score-bar-fill ' + barCls + '" style="width:' + score + '%"></div></div><span class="score-val">' + score + '</span></div></td>' +
        '</tr>';
    }).join('');
    html += '<table class="rank-table"><thead><tr><th>#</th><th>Use Case</th><th>Điểm</th></tr></thead><tbody>' + rows + '</tbody></table>';
    html += '</div></div>';
  });
  el.innerHTML = html;
}

function switchTab(tab, el) {
  _activeTab = tab;
  document.querySelectorAll('.lb-tab').forEach(function(t) { t.classList.remove('is-active'); });
  el.classList.add('is-active');
  document.getElementById('tabTop').style.display      = tab === 'top'      ? '' : 'none';
  document.getElementById('tabBottom').style.display   = tab === 'bottom'   ? '' : 'none';
  document.getElementById('tabCategory').style.display = tab === 'category' ? '' : 'none';
}

function setLoading(on) {
  document.getElementById('btnRefresh').disabled = on;
}

function setError(msg) {
  ['topTable','bottomTable','categoryContent'].forEach(function(id) {
    var el = document.getElementById(id);
    if (el) el.innerHTML = '<div style="padding:var(--space-8);text-align:center;color:var(--color-error)">' + msg + '</div>';
  });
}

function esc(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
</script>
</body>
</html>
