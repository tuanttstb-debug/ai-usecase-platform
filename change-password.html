<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Đổi mật khẩu — AI Use Case Platform TT SPTD">
  <title>Đổi mật khẩu — AI Use Case Platform</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 24 24' stroke='%231D4ED8' stroke-width='1.5'><path stroke-linecap='round' stroke-linejoin='round' d='M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09z'/></svg>">

  <link rel="stylesheet" href="assets/css/variables.css?v=20261103a">
  <link rel="stylesheet" href="assets/css/base.css?v=20261103a">
  <link rel="stylesheet" href="assets/css/typography.css?v=20261103a">
  <link rel="stylesheet" href="assets/css/components.css?v=20261103a">
  <link rel="stylesheet" href="assets/css/states.css?v=20261103a">
  <link rel="stylesheet" href="assets/css/login.css?v=20261103a">
  <script src="assets/js/theme.js?v=20261103a"></script>
</head>
<body class="login-page">

  <header class="login-header" role="banner">
    <div class="login-brand">
      <span class="login-brand-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.6" stroke="currentColor" width="18" height="18" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09z"/></svg></span>
      <span class="login-brand-name">Bình dân hóa AI</span>
    </div>
  </header>

  <main class="login-main" role="main">
    <div class="login-card" role="region" aria-label="Đổi mật khẩu">

      <div class="login-card-top">
        <div class="login-card-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.6" stroke="currentColor" width="24" height="24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 5.25a3 3 0 013 3m3 0a6 6 0 01-7.029 5.912c-.563-.097-1.159.026-1.563.43L10.5 17.25H8.25v2.25H6v2.25H2.25v-2.818c0-.597.237-1.17.659-1.591l6.499-6.499c.404-.404.527-1 .43-1.563A6 6 0 1121.75 8.25z"/></svg></div>
        <h1 class="login-card-title">Đổi mật khẩu</h1>
        <p class="login-card-subtitle">Tài khoản dùng chung với Dashboard SHTD</p>
      </div>

      <div class="login-card-body">
        <form id="cpForm" novalidate autocomplete="off" aria-label="Form đổi mật khẩu">

          <div class="login-field">
            <label class="login-label" for="cpOld">Mật khẩu hiện tại <span style="color:var(--color-error)">*</span></label>
            <input type="password" id="cpOld" class="login-input" autocomplete="current-password" placeholder="Mật khẩu hiện tại">
          </div>

          <div class="login-field">
            <label class="login-label" for="cpNew">Mật khẩu mới <span style="color:var(--color-error)">*</span></label>
            <input type="password" id="cpNew" class="login-input" autocomplete="new-password" placeholder="Tối thiểu 6 ký tự">
          </div>

          <div class="login-field">
            <label class="login-label" for="cpConfirm">Nhập lại mật khẩu mới <span style="color:var(--color-error)">*</span></label>
            <input type="password" id="cpConfirm" class="login-input" autocomplete="new-password" placeholder="Nhập lại mật khẩu mới">
            <p id="cpError" class="login-field-error" role="alert" aria-live="polite">
              <span aria-hidden="true">✕</span>
              <span id="cpErrorMsg"></span>
            </p>
          </div>

          <button type="submit" id="cpBtn" class="login-btn">
            <span class="login-btn-spinner" aria-hidden="true"></span>
            <span class="login-btn-label">Đổi mật khẩu</span>
          </button>
        </form>

        <p class="login-note">
          <a href="index.html">← Quay lại trang chủ</a>
        </p>
      </div>

    </div>
  </main>

  <script src="config/env.js"></script>
  <script src="config/routes.js"></script>
  <script src="assets/js/auth.js?v=20261103a"></script>
  <script src="assets/js/api.js?v=20261103a"></script>
  <script>
    (function () {
      'use strict';
      if (!AuthService.requireAuth()) return;

      var oldEl     = document.getElementById('cpOld');
      var newEl     = document.getElementById('cpNew');
      var confirmEl = document.getElementById('cpConfirm');
      var errorEl   = document.getElementById('cpError');
      var errorMsg  = document.getElementById('cpErrorMsg');
      var btn       = document.getElementById('cpBtn');

      function showError(msg) {
        errorMsg.textContent = msg;
        errorEl.classList.add('visible');
        btn.classList.remove('is-loading');
        btn.disabled = false;
      }
      function clearError() { errorEl.classList.remove('visible'); }
      function setLoading(on) { btn.classList.toggle('is-loading', on); btn.disabled = on; }

      [oldEl, newEl, confirmEl].forEach(function (el) { el.addEventListener('input', clearError); });

      document.getElementById('cpForm').addEventListener('submit', function (e) {
        e.preventDefault();
        clearError();

        var oldP = oldEl.value || '', newP = newEl.value || '', conf = confirmEl.value || '';
        if (!oldP)              { showError('Vui lòng nhập mật khẩu hiện tại'); return; }
        if (newP.length < 6)    { showError('Mật khẩu mới phải có ít nhất 6 ký tự'); return; }
        if (newP === oldP)      { showError('Mật khẩu mới phải khác mật khẩu cũ'); return; }
        if (newP !== conf)      { showError('Nhập lại mật khẩu mới không khớp'); return; }

        var token = AuthService.getToken();
        if (!token) { showError('Phiên đăng nhập hết hạn, vui lòng đăng nhập lại'); return; }

        setLoading(true);
        Api.changePassword(token, oldP, newP)
          .then(function () {
            if (typeof Toast !== 'undefined') Toast.show('Đổi mật khẩu thành công', 'success');
            setTimeout(function () { window.location.replace('index.html'); }, 800);
          })
          .catch(function (err) {
            showError(String(err && err.message || 'Đổi mật khẩu thất bại'));
          });
      });
    })();
  </script>

</body>
</html>
